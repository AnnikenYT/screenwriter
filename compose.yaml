services:
  screenplay:
    image: ghcr.io/annikenyt/screenwriter:latest
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-none}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      MAX_UPDATE_BYTES: ${MAX_UPDATE_BYTES:-2097152}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-8388608}
      MAX_HISTORY_BYTES: ${MAX_HISTORY_BYTES:-67108864}
      COMPACT_AFTER_UPDATES: ${COMPACT_AFTER_UPDATES:-1000}
      MAX_CACHED_DOCUMENTS: ${MAX_CACHED_DOCUMENTS:-100}
      MAX_WEBSOCKETS: ${MAX_WEBSOCKETS:-1000}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-30000}
      AUTOSNAPSHOT_INTERVAL_MS: ${AUTOSNAPSHOT_INTERVAL_MS:-300000}
    volumes:
      - screenplay-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  screenplay-data:
